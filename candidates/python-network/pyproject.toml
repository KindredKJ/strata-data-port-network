[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kindred-labs-superstructure"
version = "0.1.0"
description = "Fail-closed architecture and integration control plane for Kindred Labs"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
