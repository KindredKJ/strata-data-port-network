name: Structure Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical structure
        shell: pwsh
        run: ./operations/scripts/Test-KindredStructure.ps1
