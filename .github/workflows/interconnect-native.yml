name: INTERCONNECT native proof
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-policy-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install distribution-native WebKit dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y python3-gi python3-cairo python3-gi-cairo gir1.2-webkit2-4.1 xvfb qemu-system-x86 busybox-static cpio dbus-x11
      - name: Local navigation and receipt security tests
        run: python3 -m unittest discover -s interconnect/tests -v
      - name: Prepare pinned isolated Linux guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/interconnect-assets"
          cd "$RUNNER_TEMP/interconnect-assets"
          curl --fail --location --retry 2 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/netboot/vmlinuz-virt -o vmlinuz
          curl --fail --location --retry 2 https://dl-cdn.alpinelinux.org/alpine/v3.22/releases/x86_64/netboot/initramfs-virt -o initramfs
          echo "26f146f664ad057be3b39b211422b03b1f94cb2c3d66522fd4841811a224bfd5  vmlinuz" | sha256sum --check
          echo "e59e1b1711b553b008ac8ec7ca73c294c5b8eb8cd94b503aa560ce69b505bb13  initramfs" | sha256sum --check
      - name: Build guest base
        run: python3 scripts/prepare-two-vm-guest.py --initramfs "$RUNNER_TEMP/interconnect-assets/initramfs" --busybox /usr/bin/busybox --out "$RUNNER_TEMP/interconnect-guest"
      - name: Render with mandatory WebKit sandbox and ephemeral profile
        run: python3 scripts/native-guest-proof.py --base-guest "$RUNNER_TEMP/interconnect-guest" --kernel "$RUNNER_TEMP/interconnect-assets/vmlinuz" --qemu /usr/bin/qemu-system-x86_64 --firmware /usr/share/qemu --bios /usr/share/seabios/bios-256k.bin --out evidence/interconnect/ci
      - name: Preserve exact native proof
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: interconnect-native-${{ github.sha }}
          path: evidence/interconnect/
          if-no-files-found: error
