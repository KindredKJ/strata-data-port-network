name: SW07 Android mobile build
on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/sw07-android.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/sw07-android.yml'
permissions:
  contents: read
jobs:
  android-debug-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile mobile debug APK and run unit tests
        run: gradle -p mobile/android --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Keep debug artifact for authorized device testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sdpn-sw07-android-debug-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
