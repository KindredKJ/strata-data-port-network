name: SW07 Android mobile build
on:
  pull_request:
    paths:
      - 'mobile/android/**'
      - '.github/workflows/sw07-android.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/sw07-android.yml'
permissions:
  contents: read
jobs:
  android-debug-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform using preinstalled command-line tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Compile mobile debug APK and run unit tests
        run: gradle -p mobile/android --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Keep debug artifact for authorized device testing
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: sdpn-sw07-android-debug-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
