name: SDPN Native Terminal Windows Linux SDK
on:
  pull_request:
    paths:
      - apps/native-terminal/**
      - sdk/python/**
      - src/native-cognition-client.mjs
      - test/native-cognition.test.mjs
      - docs/SDPN-NATIVE-TERMINAL.md
      - .github/workflows/sdpn-native-terminal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/native-terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache-dependency-path: apps/native-terminal/go.mod
      - name: Go tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build native binary
        run: go build -trimpath .
  sdk-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: node --test test/native-cognition.test.mjs
      - run: python -m unittest discover -s sdk/python -p 'test_*.py'
      - run: python sdk/python/build_wheel.py
