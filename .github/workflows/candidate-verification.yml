name: Candidate verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check generated contracts
        working-directory: candidates/python-network
        run: python scripts/generate_contracts.py --check
      - name: Run Python candidate tests
        working-directory: candidates/python-network
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -q

  direct-pipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run portable buffered candidate test
        working-directory: candidates/unified-quad-direct-pipe/runtime/unified-quad
        env:
          KINDRED_DIRECT_PIPE_EVIDENCE: ${{ runner.temp }}/direct-pipe-evidence.json
        run: node --test test/direct-pipe-runtime.v1.test.mjs

  worker-transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify worker ownership transfer and hardened transport
        shell: bash
        run: |
          set -o pipefail
          mkdir -p evidence/ci
          npm test 2>&1 | tee evidence/ci/node-tests.log
      - name: Measure buffered and worker boundaries
        run: npm run measure

      - name: Retain scoped protocol evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdpn-protocol-${{ github.sha }}
          path: evidence/ci/
          if-no-files-found: error

  windows-verification-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse launchers and reject invalid verification results
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence/ci | Out-Null
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          & ./test/verification-gate.test.ps1 | Tee-Object evidence/ci/powershell-gate.log
      - name: Retain Windows gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdpn-windows-gate-${{ github.sha }}
          path: evidence/ci/
          if-no-files-found: error
