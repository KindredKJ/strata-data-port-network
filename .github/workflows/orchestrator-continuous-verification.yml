name: SDPN orchestrator continuous compatibility CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdpn-orchestrator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Check source syntax
        run: |
          node --check src/port-orchestrator.mjs
          node --check src/stratacast-topology-bridge.mjs
          node --check src/compatibility-registry.mjs
          node --check scripts/measure-orchestrator.mjs
      - name: Execute SDPN tests including orchestrator and compatibility
        run: npm test
      - name: Capture local, mocked dispatch performance
        run: |
          mkdir -p evidence/ci
          node scripts/measure-orchestrator.mjs > evidence/ci/orchestrator-benchmark.json
      - name: Record exact tested source SHA-256 and release eligibility
        run: |
          sha256sum src/port-orchestrator.mjs src/stratacast-topology-bridge.mjs src/compatibility-registry.mjs contracts/compatibility-manifest.v1.json > evidence/ci/source.sha256
          cp contracts/compatibility-manifest.v1.json evidence/ci/compatibility-manifest.v1.json
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdpn-orchestrator-${{ github.sha }}
          path: evidence/ci/
          if-no-files-found: warn
          retention-days: 30
# No production deployment job: release requires separately attested identity,
# transport, restore and signed approval before external mutations are permitted.
